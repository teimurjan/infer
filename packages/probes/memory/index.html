<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Memory Probe</title>
    <style>
        body { margin: 16px; background: #111; color: #ddd; font: 14px system-ui, sans-serif; }
        pre { white-space: pre-wrap; word-break: break-word; font-size: 12px; }
        button { margin: 0 6px 6px 0; padding: 8px 12px; font: inherit; }
    </style>
</head>
<body>
    <h2>Memory probe</h2>
    <p id="settings"></p>
    <div id="controls">
        <button data-ramps="wasm,js,gpu,mixed">Run all</button>
        <button data-ramps="wasm">WASM</button>
        <button data-ramps="js">JS</button>
        <button data-ramps="gpu">GPU</button>
        <button data-ramps="mixed">Mixed</button>
    </div>
    <p id="progress"></p>
    <pre id="results"></pre>
    <pre id="crumbs"></pre>
    <script type="module" src="../dist/memory.js"></script>
</body>
</html>
