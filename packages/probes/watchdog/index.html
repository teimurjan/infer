<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Watchdog Probe</title>
    <style>
        body { margin: 16px; background: #111; color: #ddd; font: 14px system-ui, sans-serif; }
        pre { white-space: pre-wrap; word-break: break-word; font-size: 12px; }
        button, input { margin: 0 6px 6px 0; padding: 8px 12px; font: inherit; }
        input { width: 7em; }
    </style>
</head>
<body>
    <h2>Watchdog probe</h2>
    <p id="settings"></p>
    <div>
        <button id="find">Find limit, then split</button>
        <button id="reset">Reset</button>
    </div>
    <div>
        <input id="dial-ms" type="number" min="1" value="1000" aria-label="Single dispatch duration in ms">
        <button id="dial-run">Run one dispatch (ms)</button>
    </div>
    <p id="progress"></p>
    <pre id="summary"></pre>
    <pre id="runs"></pre>
    <pre id="crumbs"></pre>
    <script type="module" src="../dist/watchdog.js"></script>
</body>
</html>
