[package]
name = "lfm3-engine"
version = "0.1.0"
edition = "2024"

[lib]
# cdylib is the .wasm file for the browser. rlib lets the native tests use the crate.
crate-type = ["cdylib", "rlib"]

[dependencies]
# The GPU base that all model engines share: packages/engine-core.
engine-core = { path = "../../../packages/engine-core" }
# The buffer type that the kernels bind. The same version as engine-core.
wgpu = { version = "30", default-features = false, features = ["std", "metal", "webgpu", "wgsl"] }

[dev-dependencies]
# Runs one async function to the end on the native test thread.
pollster = "1"
# Reads the golden safetensors files. It is our own crate in packages/compare.
compare = { path = "../../../packages/compare" }
